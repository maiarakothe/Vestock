name: front
description: "Vestock front-end"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  flutter_slidable: ^3.1.0
  awidgets:
    git:
      url: https://gitlab.com/almeidatech/awidgets.git
      ref: main # main commit hash

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-icon.png"

  web:
    generate: true
    image_path: "assets/images/logo-icon.png"

  windows:
    generate: true
    image_path: "assets/images/logo-icon.png"

  macos:
    generate: true
    image_path: "assets/images/logo-icon.png"

  linux:
    generate: true
    image_path: "assets/images/logo-icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

